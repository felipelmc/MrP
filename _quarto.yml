project:
  type: course-notes
  render:
    - index.qmd
    - capitulos/*.qmd
    - referencias.qmd

book:
  title: "MrP"
  subtitle: "Regressão multinível com pós-estratificação"
  author: "Felipe Lamarca"
  date: last-modified
  site-url: https://felipelamarca.com/MrP/
  repo-url: https://github.com/felipelmc/MrP
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "MrP"
        href: index.qmd
  chapters:
    - index.qmd
    - part: "Estudo"
      chapters:
        - href: capitulos/01-amostras-nao-probabilisticas.qmd
          text: "01 · Amostras não probabilísticas"
        - href: capitulos/02-modelos-multinivel.qmd
          text: "02 · Modelos multinível"
        - href: capitulos/03-estimador-mrp.qmd
          text: "03 · O estimador MrP"
        - href: capitulos/04-mrp-bayesiano.qmd
          text: "04 · MrP bayesiano e incerteza"
        - href: capitulos/05-especificacao-validacao.qmd
          text: "05 · Especificação e validação"
        - href: capitulos/06-harmonizacao-faltantes.qmd
          text: "06 · Harmonização e dados faltantes"
        - href: capitulos/07-frames-nao-censitarios.qmd
          text: "07 · Variáveis fora do censo"
        - href: capitulos/08-alem-do-binario.qmd
          text: "08 · Além do desfecho binário"
        - href: capitulos/09-alternativas-sensibilidade.qmd
          text: "09 · Alternativas e sensibilidade"
    - referencias.qmd

bibliography: [references.bib]

# Excecao deste livro: coluna de leitura mais larga (tema/largura.scss), por
# cima do tema da extensao
format:
  course-notes-html:
    theme:
      light: [_extensions/felipelmc/course-notes/theme/notes-light.scss, tema/largura.scss]
      dark: [_extensions/felipelmc/course-notes/theme/notes-dark.scss, tema/largura.scss]

