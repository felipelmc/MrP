# Subprojeto de slides: fica fora da renderização do livro (ver project.render no _quarto.yml
# da raiz). Renderize com `quarto render trabalhos/apresentacao/slides` e faça o commit do
# index.html gerado, que é autocontido.
project:
  type: default

format:
  revealjs:
    theme:
      - default
      - ../../../_extensions/felipelmc/course-notes/theme/notes-revealjs.scss
    include-in-header:
      - text: '<link rel="stylesheet" href="../../../_extensions/felipelmc/course-notes/fonts/fonts.css">'
    embed-resources: true
    slide-number: true
    footer: "felipelamarca.com"
    lang: pt-BR
